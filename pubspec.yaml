name: civicshield
description: "CivicShield — Know Your Rights. Verify Enforcement. Strengthen Accountability."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.2.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  http: ^1.1.0
  image_picker: ^1.1.2
  
  # Backend - Supabase
  supabase_flutter: ^2.4.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/fines.json
    - assets/data/rights_cards.json
    - assets/data/schemes.json
    - assets/data/hotspots.json
    - assets/data/legal_services.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

# Fonts handled by google_fonts package
